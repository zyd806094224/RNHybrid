plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.facebook.react'
    id 'kotlin-kapt'
}

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    namespace "com.example.rnandroiddemo"

    defaultConfig {
        applicationId rootProject.ext.android.applicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.android.versionCode
        versionName rootProject.ext.android.versionName

        // ARouter
        kapt {
            arguments {
                arg("AROUTER_MODULE_NAME", project.getName())
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'rnhybrid123'
            keyAlias 'release'
            keyPassword 'rnhybrid123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            crunchPngs false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }
}

dependencies {
    // React Native
    implementation "com.facebook.react:react-android:0.72.17"
    if (hermesEnabled.toBoolean()) {
        implementation 'com.facebook.react:hermes-android:0.72.17'
    } else {
        implementation 'org.webkit:android-jsc:+'
    }

    // From node_modules
    implementation project(':react-native-screens')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-update')

    // AndroidX
    implementation libs.coreKtx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.liveDataKtx
    implementation libs.viewModelKtx
    implementation libs.navigationFragment
    implementation libs.navigationUI
    implementation libs.lifecycleCommon
    implementation libs.multidex

    // Network
    implementation libs.retrofit2
    implementation libs.retrofit2Gson
    implementation libs.loggingInterceptor
    implementation libs.gson
    implementation libs.mmkv

    // ARouter
    implementation libs.arouterApi
    kapt libs.arouterCompiler

    // Refresh
    implementation libs.refreshLayout
    implementation libs.refreshHeader
    implementation libs.refreshFooter

    // Permissions
    implementation libs.xxPermissions

    // KMP shared IM 模块（从 GitHub Packages 拉取，POM 自动传递 ktor/coroutines/serialization 依赖）
    implementation "com.github.zyd806094224:shared:1.0.0"

    // Test
    testImplementation libs.junit
    androidTestImplementation libs.extJunit
    androidTestImplementation libs.espressoCore

    // Internal modules
    implementation project(path: ':lib_framework')
    implementation project(path: ':lib_network')
    implementation project(path: ':lib_rn')
    implementation project(path: ':lib_im')
}
