[versions]
agp = "7.3.0"
kotlin = "1.8.0"
coreKtx = "1.9.0"
appcompat = "1.3.0"
material = "1.4.0"
constraintlayout = "2.0.4"
lifecycle = "2.4.0"
navigation = "2.3.5"
datastore = "1.0.0"
recyclerview = "1.2.1"
junit = "4.13.2"
extJunit = "1.1.3"
espressoCore = "3.4.0"
multidex = "2.0.1"
retrofit = "2.9.0"
retrofitGson = "2.4.0"
okhttp3Log = "3.11.0"
gson = "2.10.1"
mmkv = "1.2.15"
refresh = "2.0.5"
arouterApi = "1.5.2"
arouterCompiler = "1.5.2"
rxjava = "3.1.6"
rxandroid = "3.0.2"
permissions = "26.8"

[libraries]
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
liveDataKtx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
viewModelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
navigationFragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigationUI = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
lifecycleCommon = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
junit = { module = "junit:junit", version.ref = "junit" }
extJunit = { module = "androidx.test.ext:junit", version.ref = "extJunit" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
retrofit2 = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit2Gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofitGson" }
loggingInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp3Log" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
refreshLayout = { module = "io.github.scwang90:refresh-layout-kernel", version.ref = "refresh" }
refreshHeader = { module = "io.github.scwang90:refresh-header-classics", version.ref = "refresh" }
refreshFooter = { module = "io.github.scwang90:refresh-footer-classics", version.ref = "refresh" }
arouterApi = { module = "com.alibaba:arouter-api", version.ref = "arouterApi" }
arouterCompiler = { module = "com.alibaba:arouter-compiler", version.ref = "arouterCompiler" }
rxjava2 = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava" }
rxandroid2 = { module = "io.reactivex.rxjava3:rxandroid", version.ref = "rxandroid" }
xxPermissions = { module = "com.github.getActivity:XXPermissions", version.ref = "permissions" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
